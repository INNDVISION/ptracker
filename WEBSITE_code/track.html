<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track the Air Quality</title>
  <link rel="stylesheet" href="stylesheets/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="stylesheets/nav.css">
</head>
<body>
  <div class="container">
    <nav class="main-nav">
      <ul class="nav-list">
        <li><a href="index.html">HOME</a></li>
      </ul>
    </nav>

    <h1>Track the Air Quality</h1>
    <table id="data-table">
      <thead>
        <tr>
          <th>Timestamp</th>
          <th>PM2.5 (µg/m³)</th>
          <th>PM10 (µg/m³)</th>
          <th>Coordinates (lat, long)</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td id="timestamp">-</td>
          <td id="pm25">-</td>
          <td id="pm10">-</td>
          <td id="coordinates">-</td>
        </tr>
      </tbody>
    </table>

    <div class="tracking-block">
      <button id="start-btn">Start</button>
      <button id="stop-btn" disabled>Stop</button>
      <div id="timer">00:00:00</div>
      <div id="average-quality">
        <p id="avg-pm25">Average PM2.5: -</p>
        <p id="avg-pm10">Average PM10: -</p>
      </div>
    </div>

    <div id="map"></div>

    <button id="toggle-history">Show History</button>
    <div class="history">
      <table class="history-table">
        <thead>
          <tr>
            <th>Timestamp</th>
            <th>PM2.5 (µg/m³)</th>
            <th>PM10 (µg/m³)</th>
            <th>Coordinates (lat, long)</th>
          </tr>
        </thead>
        <tbody id="history-body">
          <!-- History data will be appended here -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/script.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
